name: CI/CD Pipeline (Frontend + Backend + DB)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Логинимся в Docker Hub (используя наши Secrets)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Настраиваем Buildx для быстрой сборки
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Проверяем сборку и запуск всей системы через Docker Compose в облаке
    - name: Test stack with Docker Compose
      run: |
        docker compose up -d --build
        echo "Waiting for services to start..."
        sleep 10
        docker compose ps

    # 5. Собираем и пушим образ ФРОНТЕНДА в Docker Hub
    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/my-art-gallery-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/my-art-gallery-frontend:${{ github.sha }}

    # 6. Собираем и пушим образ БЭКЕНДА в Docker Hub
    - name: Build and Push Backend Image
      uses: docker/build-push-action@v6
      with:
        context: server
        file: ./server/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/my-art-gallery-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/my-art-gallery-backend:${{ github.sha }}